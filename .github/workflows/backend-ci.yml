name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: nexbit_ci
      CORS_ORIGINS: "*"
      NEXBIT_PRODUCTION: "false"
      NEXBIT_CUSTODY_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Compile backend
        working-directory: backend
        run: python -m py_compile server.py custody.py matching_engine.py models.py

      - name: Start API
        working-directory: backend
        run: |
          nohup python -m uvicorn server:app --host 127.0.0.1 --port 8000 > /tmp/nexbit-api.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nexbit-api.log
          exit 1

      - name: Run backend integration tests
        run: |
          set -o pipefail
          python -m pytest backend/tests/test_nexbit_backend.py -q --disable-warnings --maxfail=1
        env:
          NEXBIT_TEST_BASE_URL: http://127.0.0.1:8000

      - name: Dump API log on failure
        if: failure()
        run: |
          echo "===== NEXBIT API LOG ====="
          cat /tmp/nexbit-api.log || true
          echo "===== END NEXBIT API LOG ====="
